              <div><label style={{fontSize:12,fontWeight:500,color:"var(--bark)",display:"block",marginBottom:4}}>Country *</label><input className="input" placeholder="Italy" value={tripForm.country} onChange={e=>setTripForm(f=>({...f,country:e.target.value}))}/></div>
              <div><label style={{fontSize:12,fontWeight:500,color:"var(--bark)",display:"block",marginBottom:4}}>Cities</label><input className="input" placeholder="Rome, Florence, Amalfi" value={tripForm.cities} onChange={e=>setTripForm(f=>({...f,cities:e.target.value}))}/></div>
              <div><label style={{fontSize:12,fontWeight:500,color:"var(--bark)",display:"block",marginBottom:4}}>Status</label><select className="input sel" value={tripForm.status} onChange={e=>setTripForm(f=>({...f,status:e.target.value}))}>{Object.keys(STATUS_META).map(s=><option key={s}>{s}</option>)}</select></div>
              <div><label style={{fontSize:12,fontWeight:500,color:"var(--bark)",display:"block",marginBottom:4}}>Trip Type</label><select className="input sel" value={tripForm.type} onChange={e=>setTripForm(f=>({...f,type:e.target.value}))}>{TRIP_TYPES.map(t=><option key={t}>{t}</option>)}</select></div>
              <div><label style={{fontSize:12,fontWeight:500,color:"var(--bark)",display:"block",marginBottom:4}}>Start Date</label><input className="input" type="date" value={tripForm.startDate} onChange={e=>setTripForm(f=>({...f,startDate:e.target.value}))}/></div>
              <div><label style={{fontSize:12,fontWeight:500,color:"var(--bark)",display:"block",marginBottom:4}}>End Date</label><input className="input" type="date" value={tripForm.endDate} onChange={e=>setTripForm(f=>({...f,endDate:e.target.value}))}/></div>
              <div style={{gridColumn:"1/-1"}}><label style={{fontSize:12,fontWeight:500,color:"var(--bark)",display:"block",marginBottom:4}}>Cover Image URL</label><input className="input" placeholder="https://…" value={tripForm.coverImage} onChange={e=>setTripForm(f=>({...f,coverImage:e.target.value}))}/></div>
              {tripForm.cities&&<div style={{gridColumn:"1/-1",background:"#fffbf0",borderRadius:10,padding:"10px 12px",fontSize:12,color:"#92400e"}}>
                💳 Apply for {topTravelCard.name} before booking — use this trip to hit the <strong>{topTravelCard.signupBonus}</strong> signup bonus.*
                <button className="btn btn-gold" style={{marginLeft:8,padding:"4px 10px",fontSize:11}} onClick={()=>openAffiliate(topTravelCard.id)}>Apply →</button>
                <AffiliateDisclosure/>
              </div>}
              <div style={{gridColumn:"1/-1",display:"flex",gap:8}}><button className="btn btn-primary" style={{flex:1}} onClick={addTrip} disabled={!tripForm.title||!tripForm.country}>Create Trip 🌍</button><button className="btn btn-secondary" onClick={()=>setShowAddTrip(false)}>Cancel</button></div>
            </div>
          </div>
        </div>
      )}

      {/* Add Transport */}
      {showAddTransport&&(
        <div className="overlay" onClick={()=>setShowAddTransport(false)}>
          <div className="modal modal-wide" style={{padding:"22px 26px"}} onClick={e=>e.stopPropagation()}>
            <div className="serif" style={{fontSize:20,fontWeight:700,marginBottom:3}}>Add Transport</div>
            <p style={{fontSize:13,color:"var(--bark)",marginBottom:14}}>Flight, train, ferry, car rental…</p>
            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10}}>
              <div style={{gridColumn:"1/-1"}}><label style={{fontSize:12,fontWeight:500,color:"var(--bark)",display:"block",marginBottom:4}}>Type</label><div style={{display:"flex",gap:6,flexWrap:"wrap"}}>{TRANSPORT_TYPES.map(t=><button key={t} className={`pill${transportForm.type===t?" active":""}`} onClick={()=>setTransportForm(f=>({...f,type:t}))}>{TRANSPORT_ICONS[t]} {t}</button>)}</div></div>
              <div><label style={{fontSize:12,fontWeight:500,color:"var(--bark)",display:"block",marginBottom:4}}>From *</label><input className="input" placeholder="New York (JFK)" value={transportForm.from} onChange={e=>setTransportForm(f=>({...f,from:e.target.value}))}/></div>
              <div><label style={{fontSize:12,fontWeight:500,color:"var(--bark)",display:"block",marginBottom:4}}>To *</label><input className="input" placeholder="Paris (CDG)" value={transportForm.to} onChange={e=>setTransportForm(f=>({...f,to:e.target.value}))}/></div>
              <div><label style={{fontSize:12,fontWeight:500,color:"var(--bark)",display:"block",marginBottom:4}}>Date</label><input className="input" type="date" value={transportForm.date} onChange={e=>setTransportForm(f=>({...f,date:e.target.value}))}/></div>
              <div><label style={{fontSize:12,fontWeight:500,color:"var(--bark)",display:"block",marginBottom:4}}>Time</label><input className="input" type="time" value={transportForm.time} onChange={e=>setTransportForm(f=>({...f,time:e.target.value}))}/></div>
              <div><label style={{fontSize:12,fontWeight:500,color:"var(--bark)",display:"block",marginBottom:4}}>Carrier</label><input className="input" placeholder="Air France" value={transportForm.carrier} onChange={e=>setTransportForm(f=>({...f,carrier:e.target.value}))}/></div>
              <div><label style={{fontSize:12,fontWeight:500,color:"var(--bark)",display:"block",marginBottom:4}}>Flight/Ref No.</label><input className="input" placeholder="AF 006" value={transportForm.flightNo} onChange={e=>setTransportForm(f=>({...f,flightNo:e.target.value}))}/></div>
              <div><label style={{fontSize:12,fontWeight:500,color:"var(--bark)",display:"block",marginBottom:4}}>Confirmation #</label><input className="input" placeholder="ABC123" value={transportForm.confirmNo} onChange={e=>setTransportForm(f=>({...f,confirmNo:e.target.value}))}/></div>
              <div><label style={{fontSize:12,fontWeight:500,color:"var(--bark)",display:"block",marginBottom:4}}>Cost ($)</label><input className="input" type="number" placeholder="450" value={transportForm.cost} onChange={e=>setTransportForm(f=>({...f,cost:e.target.value}))}/></div>
              <div style={{gridColumn:"1/-1"}}><label style={{fontSize:12,fontWeight:500,color:"var(--bark)",display:"block",marginBottom:4}}>Notes</label><textarea className="input" rows={2} value={transportForm.notes} onChange={e=>setTransportForm(f=>({...f,notes:e.target.value}))} style={{resize:"vertical"}}/></div>
              {transportForm.type==="Flight"&&<div style={{gridColumn:"1/-1",background:"#e0f2fe",borderRadius:10,padding:"9px 12px",fontSize:12,color:"#0369a1"}}>✈️ Book with <strong>Delta SkyMiles Gold</strong> or <strong>United Explorer</strong> — earn miles + free first bag (saves ~$35/person).<button className="btn btn-gold" style={{marginLeft:8,padding:"4px 10px",fontSize:11}} onClick={()=>openAffiliate("delta-skymiles-gold")}>See Cards →</button><AffiliateDisclosure/></div>}
              <div style={{gridColumn:"1/-1",display:"flex",gap:8}}><button className="btn btn-primary" style={{flex:1}} onClick={addTransport} disabled={!transportForm.from||!transportForm.to}>Save ✈️</button><button className="btn btn-secondary" onClick={()=>setShowAddTransport(false)}>Cancel</button></div>
            </div>
          </div>
        </div>
      )}

      {/* Parking Modal */}
      {showParkingModal&&(
        <div className="overlay" onClick={()=>setShowParkingModal(false)}>
          <div className="modal modal-wide" style={{padding:"22px 26px"}} onClick={e=>e.stopPropagation()}>
            <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:3}}><span style={{fontSize:24}}>🅿️</span><div className="serif" style={{fontSize:20,fontWeight:700}}>Where Did You Park?</div></div>
            <p style={{fontSize:13,color:"var(--bark)",marginBottom:16}}>Save your spot so you never wander a garage at midnight</p>
            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:11}}>
              <div style={{gridColumn:"1/-1"}}>
                {parkingPhotoPreview?<div style={{position:"relative",borderRadius:12,overflow:"hidden",marginBottom:4}}><img src={parkingPhotoPreview} alt="" style={{width:"100%",height:150,objectFit:"cover"}}/><button onClick={()=>setParkingPhotoPreview(null)} style={{position:"absolute",top:8,right:8,background:"rgba(0,0,0,.6)",border:"none",borderRadius:"50%",width:26,height:26,color:"#fff",cursor:"pointer",fontSize:13}}>✕</button></div>
                :<label style={{display:"block",border:"2px dashed var(--sand)",borderRadius:12,padding:"20px",textAlign:"center",cursor:"pointer",background:"#fafaf8"}}><input type="file" accept="image/*" style={{display:"none"}} onChange={handleParkingPhoto}/><div style={{fontSize:28,marginBottom:5}}>📸</div><div style={{fontSize:12,color:"var(--bark)"}}>Tap to take or upload photo</div></label>}
              </div>
              <div style={{gridColumn:"1/-1"}}><label style={{fontSize:12,fontWeight:500,color:"var(--bark)",display:"block",marginBottom:4}}>Space Number</label><input className="input" placeholder="e.g. 2B-47" value={parkingForm.space} onChange={e=>setParkingForm(f=>({...f,space:e.target.value}))} style={{fontSize:20,fontWeight:700,textAlign:"center",color:"#0369a1"}}/></div>
              <div><label style={{fontSize:12,fontWeight:500,color:"var(--bark)",display:"block",marginBottom:4}}>Airport</label><input className="input" placeholder="JFK" value={parkingForm.airport} onChange={e=>setParkingForm(f=>({...f,airport:e.target.value}))}/></div>
              <div><label style={{fontSize:12,fontWeight:500,color:"var(--bark)",display:"block",marginBottom:4}}>Level</label><input className="input" placeholder="Level 2" value={parkingForm.level} onChange={e=>setParkingForm(f=>({...f,level:e.target.value}))}/></div>
              <div><label style={{fontSize:12,fontWeight:500,color:"var(--bark)",display:"block",marginBottom:4}}>Lot</label><input className="input" placeholder="Lot P3" value={parkingForm.lot} onChange={e=>setParkingForm(f=>({...f,lot:e.target.value}))}/></div>
              <div><label style={{fontSize:12,fontWeight:500,color:"var(--bark)",display:"block",marginBottom:4}}>Notes</label><input className="input" placeholder="Blue section, elevator C" value={parkingForm.notes} onChange={e=>setParkingForm(f=>({...f,notes:e.target.value}))}/></div>
              <div><label style={{fontSize:12,fontWeight:500,color:"var(--bark)",display:"block",marginBottom:4}}>Daily Rate ($)</label><input className="input" type="number" placeholder="35" value={parkingForm.dailyRate} onChange={e=>setParkingForm(f=>({...f,dailyRate:e.target.value}))}/></div>
              <div><label style={{fontSize:12,fontWeight:500,color:"var(--bark)",display:"block",marginBottom:4}}>Days</label><input className="input" type="number" placeholder="10" value={parkingForm.totalDays} onChange={e=>setParkingForm(f=>({...f,totalDays:e.target.value}))}/></div>
              {parkingForm.dailyRate&&parkingForm.totalDays&&<div style={{gridColumn:"1/-1",background:"#e0f2fe",borderRadius:10,padding:"9px 12px",display:"flex",justifyContent:"space-between",alignItems:"center"}}><span style={{fontSize:12,color:"#0369a1",fontWeight:500}}>Estimated cost</span><span style={{fontSize:20,fontWeight:700,color:"#0369a1"}}>${(Number(parkingForm.dailyRate)*Number(parkingForm.totalDays)).toLocaleString()}</span></div>}
              <div style={{gridColumn:"1/-1",display:"flex",gap:8}}><button className="btn btn-primary" style={{flex:1}} onClick={saveParking}>🅿️ Save Spot</button><button className="btn btn-secondary" onClick={()=>setShowParkingModal(false)}>Cancel</button></div>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

    // ─── RENDER ────────────────────────────────────────────────────────────────
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(React.createElement(Wanderlist));

    // Hide loading screen after React first paint
    setTimeout(() => { const el = document.getElementById("loading"); if(el) el.style.display = "none"; }, 100);

  </script>
</body>
</html>
