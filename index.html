const fmtDate = d => { if(!d) return ""; return new Date(d+"T00:00:00").toLocaleDateString("en-US",{month:"short",day:"numeric",year:"numeric"}); };
const fmtDateShort = d => { if(!d) return ""; return new Date(d+"T00:00:00").toLocaleDateString("en-US",{month:"short",day:"numeric"}); };
const nights = (s,e) => { if(!s||!e) return 0; return Math.max(0,Math.round((new Date(e)-new Date(s))/86400000)); };
const totalSpent = b => Object.values(b?.spent||{}).reduce((a,v)=>a+(Number(v)||0),0);
const getBestCard = cat => CARDS.filter(c=>c.type==="travel"||c.type==="hotel"||c.type==="airline").sort((a,b)=>(b.rewardRates[cat]||b.rewardRates.default)-(a.rewardRates[cat]||a.rewardRates.default))[0];
const calcRewards = (card,budget) => { let t=0; Object.entries(budget?.spent||{}).forEach(([cat,spent])=>{ const r=card.rewardRates[cat]||card.rewardRates.default; t+=spent*(r/100); }); return t; };
function getDatesInRange(start, end) {
  const dates=[]; let cur=new Date(start+"T00:00:00"); const endD=new Date(end+"T00:00:00");
  while(cur<=endD){ dates.push(cur.toISOString().split("T")[0]); cur.setDate(cur.getDate()+1); }
  return dates;
}

}

// ─── DISCOVER VIEW ────────────────────────────────────────────────────────────
function DiscoverView({ boards, onSaveToBoard, onCreateBoard }) {
  const [filterCat, setFilterCat] = useState("All");
  const [filterCountry, setFilterCountry] = useState("All");
  const [search, setSearch] = useState("");
  const [savedIds, setSavedIds] = useState(new Set());
  const [saveTarget, setSaveTarget] = useState(null); // place being saved
  const [showBoardPicker, setShowBoardPicker] = useState(false);
  const [newBoardName, setNewBoardName] = useState("");

  const countries = ["All", ...new Set(DISCOVER_PLACES.map(p=>p.country))];
  const filtered = DISCOVER_PLACES.filter(p=>{
    if(filterCat!=="All" && p.category!==filterCat) return false;
    if(filterCountry!=="All" && p.country!==filterCountry) return false;
    if(search && !p.title.toLowerCase().includes(search.toLowerCase()) && !p.city.toLowerCase().includes(search.toLowerCase()) && !p.country.toLowerCase().includes(search.toLowerCase())) return false;
    return true;
  });
  const trending = DISCOVER_PLACES.filter(p=>p.trending).slice(0,4);

  function handleSave(place) {
    setSaveTarget(place);
    setShowBoardPicker(true);
  }
  function confirmSave(boardId) {
    onSaveToBoard({id:Date.now(), boardId, source:saveTarget.source, title:saveTarget.title, city:saveTarget.city, country:saveTarget.country, category:saveTarget.category, note:saveTarget.note, image:saveTarget.image, address:saveTarget.city+", "+saveTarget.country, savedAt:new Date().toISOString().split("T")[0]}, boardId);
    setSavedIds(s=>new Set([...s, saveTarget.id]));
    setSaveTarget(null); setShowBoardPicker(false);
  }
  function createAndSave() {
    if(!newBoardName.trim()) return;
    const newBoard = {id:"b"+Date.now(), name:newBoardName, description:"", color:"#fef3c7", placeIds:[]};
    onCreateBoard(newBoard);
    confirmSave(newBoard.id);
    setNewBoardName("");
  }

  return (
    <div className="fade-in">
      <div className="serif" style={{fontSize:32,fontWeight:700,color:"var(--espresso)",marginBottom:4}}>Discover</div>
      <p style={{fontSize:13,color:"var(--bark)",marginBottom:18}}>Trending places from travelers worldwide — tap to save to your boards</p>

      {/* Trending hero row */}
      <div style={{marginBottom:24}}>
        <div style={{fontSize:12,fontWeight:700,color:"var(--bark)",textTransform:"uppercase",letterSpacing:".06em",marginBottom:10}}>🔥 Trending Right Now</div>
        <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(220px,1fr))",gap:12}}>
          {trending.map(place=>(
            <div key={place.id} style={{position:"relative",borderRadius:16,overflow:"hidden",height:150,cursor:"pointer"}} onClick={()=>handleSave(place)}>
              <img src={place.image} alt="" style={{width:"100%",height:"100%",objectFit:"cover"}}/>
              <div style={{position:"absolute",inset:0,background:"linear-gradient(to top,rgba(18,16,14,.75) 0%,transparent 50%)"}}/>
              <div style={{position:"absolute",top:8,right:8,background:"rgba(255,255,255,.9)",borderRadius:20,padding:"3px 9px",fontSize:11,fontWeight:700,color:"var(--espresso)"}}>{(place.saves/1000).toFixed(1)}k saved</div>
              <div style={{position:"absolute",bottom:0,left:0,right:0,padding:"10px 12px"}}>
                <div style={{color:"#fff",fontSize:13,fontWeight:700,lineHeight:1.2}}>{place.title}</div>
                <div style={{color:"rgba(255,255,255,.75)",fontSize:11,marginTop:2}}>{place.city}, {place.country}</div>
              </div>
              <div style={{position:"absolute",bottom:8,right:8,width:28,height:28,borderRadius:"50%",background:savedIds.has(place.id)?"#dcfce7":"rgba(255,255,255,.9)",display:"flex",alignItems:"center",justifyContent:"center",fontSize:14}}>
                {savedIds.has(place.id)?"✓":"＋"}
              </div>
            </div>
          ))}
        </div>
      </div>

      {/* Search + filters */}
      <div style={{display:"flex",gap:9,marginBottom:10,flexWrap:"wrap",alignItems:"center"}}>
        <input className="input" placeholder="Search places, cities, countries…" value={search} onChange={e=>setSearch(e.target.value)} style={{flex:"1 1 200px",minWidth:160}}/>
      </div>
      <div style={{display:"flex",gap:7,marginBottom:10,flexWrap:"wrap"}}>
        {CATEGORIES.map(c=><button key={c} className={`pill${filterCat===c?" active":""}`} onClick={()=>setFilterCat(c)}>{c==="All"?"🌍 "+c:CAT_META[c]?.icon+" "+c}</button>)}
      </div>
      <div style={{display:"flex",gap:7,marginBottom:18,flexWrap:"wrap"}}>
        {countries.map(c=><button key={c} className={`pill${filterCountry===c?" active":""}`} onClick={()=>setFilterCountry(c)}>{c}</button>)}
      </div>

      {/* All places grid */}
      <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(240px,1fr))",gap:14}}>
        {filtered.map(place=>{
          const isSaved = savedIds.has(place.id);
          const bc = getBestCard(place.category);
          return(
            <div key={place.id} className="card">
              <div style={{position:"relative"}}>
                <img src={place.image} alt="" style={{width:"100%",height:145,objectFit:"cover",display:"block"}}/>
                <div style={{position:"absolute",top:8,left:8}}>
                  <span className="chip" style={{background:SOURCE_META[place.source]?.bg,color:SOURCE_META[place.source]?.text}}>{SOURCE_META[place.source]?.icon} {place.source}</span>
                </div>
                <div style={{position:"absolute",top:8,right:8,background:"rgba(255,255,255,.9)",borderRadius:20,padding:"2px 8px",fontSize:10,fontWeight:700,color:"var(--bark)"}}>{(place.saves/1000).toFixed(1)}k</div>
                <button
                  style={{position:"absolute",bottom:8,right:8,width:34,height:34,borderRadius:"50%",background:isSaved?"#dcfce7":"var(--espresso)",border:"none",cursor:"pointer",fontSize:16,display:"flex",alignItems:"center",justifyContent:"center",color:isSaved?"#166534":"#f5e6c8",transition:"all .2s"}}
                  onClick={()=>isSaved?null:handleSave(place)}>
                  {isSaved?"✓":"＋"}
                </button>
              </div>
              <div style={{padding:"10px 13px 12px"}}>
                <div className="serif" style={{fontSize:14,fontWeight:700,marginBottom:3}}>{place.title}</div>
                <div style={{fontSize:11,color:"var(--bark)",marginBottom:5,display:"flex",gap:5,alignItems:"center"}}>
                  📍 {place.city}, {place.country}
                  <span className="chip" style={{background:CAT_META[place.category]?.color,color:CAT_META[place.category]?.text,fontSize:10}}>{CAT_META[place.category]?.icon} {place.category}</span>
                </div>
                <p style={{fontSize:12,color:"#5a4a38",lineHeight:1.5,marginBottom:8}}>{place.note}</p>
                <div style={{background:"#fffbf0",borderRadius:7,padding:"5px 8px",fontSize:11,color:"#92400e",display:"flex",alignItems:"center",gap:5}}>
                  <span>{bc.logo}</span><span><strong>{bc.name}</strong> earns <strong>{bc.rewardRates[place.category]||1}x</strong> here</span>
                  <span style={{fontSize:9,opacity:.6,marginLeft:"auto"}}>*ad</span>
                </div>
              </div>
            </div>
          );
        })}
        {filtered.length===0&&<div style={{gridColumn:"1/-1"}} className="empty-state"><div style={{fontSize:40}}>🔍</div><div className="serif" style={{fontSize:18,marginTop:8}}>No results for "{search}"</div></div>}
      </div>

      {/* Board picker modal */}
      {showBoardPicker&&saveTarget&&(
        <div className="overlay" onClick={()=>setShowBoardPicker(false)}>
          <div className="modal" style={{padding:"22px 24px"}} onClick={e=>e.stopPropagation()}>
            <div className="serif" style={{fontSize:20,fontWeight:700,marginBottom:4}}>Save to Board</div>
            <p style={{fontSize:13,color:"var(--bark)",marginBottom:14}}>Which board should <strong>{saveTarget.title}</strong> go on?</p>
            {boards.length>0&&<div style={{display:"flex",flexDirection:"column",gap:8,marginBottom:12}}>
              {boards.map(b=><button key={b.id} style={{background:"var(--cream)",border:"1.5px solid var(--sand)",borderRadius:12,padding:"11px 15px",cursor:"pointer",textAlign:"left",fontFamily:"'Outfit',sans-serif",fontSize:13,fontWeight:600}} onClick={()=>confirmSave(b.id)}>{b.name}</button>)}
            </div>}
            <div style={{borderTop:"1px solid var(--sand)",paddingTop:12}}>
              <div style={{fontSize:12,fontWeight:500,color:"var(--bark)",marginBottom:7}}>Or create a new board</div>
              <div style={{display:"flex",gap:8}}>
                <input className="input" placeholder="Board name…" value={newBoardName} onChange={e=>setNewBoardName(e.target.value)} onKeyDown={e=>e.key==="Enter"&&createAndSave()} style={{flex:1}}/>
                <button className="btn btn-primary" style={{padding:"11px 14px"}} onClick={createAndSave} disabled={!newBoardName.trim()}>Create & Save</button>
              </div>
            </div>
            <button className="btn btn-secondary" style={{width:"100%",marginTop:10}} onClick={()=>setShowBoardPicker(false)}>Cancel</button>
          </div>
        </div>
      )}
    </div>
  );
}

// ─── SINGLE BOARD VIEW ────────────────────────────────────────────────────────
function BoardDetail({ board, savedPlaces, onBack, onAddPlace, onRemovePlace, trips, onMoveToTrip }) {
  const [showSave, setShowSave] = useState(false);
  const [filterCat, setFilterCat] = useState("All");
  const [filterSrc, setFilterSrc] = useState("All");
  const [movingPlace, setMovingPlace] = useState(null);
  const bPlaces = savedPlaces.filter(p=>board.placeIds.includes(p.id));
  const filtered = bPlaces.filter(p=>(filterCat==="All"||p.category===filterCat)&&(filterSrc==="All"||p.source===filterSrc));

  const bestCard = CARDS.find(c=>c.id==="chase-sapphire-preferred");

  return (
    <div className="fade-in">
      <div style={{display:"flex",alignItems:"center",gap:12,marginBottom:16,flexWrap:"wrap"}}>
        <button style={{background:"none",border:"none",cursor:"pointer",fontSize:14,color:"var(--bark)",padding:"6px 10px",borderRadius:8,background:"var(--cream)"}} onClick={onBack}>← Boards</button>
        <div style={{flex:1}}>
          <div className="serif" style={{fontSize:26,fontWeight:700}}>{board.name}</div>
          {board.description&&<div style={{fontSize:13,color:"var(--bark)"}}>{board.description}</div>}
        </div>
        <button className="btn btn-save" style={{padding:"9px 14px",fontSize:13}} onClick={()=>setShowSave(true)}>📸 Save Place</button>
      </div>

      {/* Filters */}
      <div style={{display:"flex",gap:7,marginBottom:8,flexWrap:"wrap"}}>
        {CATEGORIES.map(c=><button key={c} className={`pill${filterCat===c?" active":""}`} onClick={()=>setFilterCat(c)}>{c}</button>)}
      </div>
      <div style={{display:"flex",gap:7,marginBottom:18,flexWrap:"wrap"}}>
        {["All",...Object.keys(SOURCE_META)].map(s=>(
          <button key={s} className={`pill${filterSrc===s?" active":""}`} onClick={()=>setFilterSrc(s)}>{SOURCE_META[s]?.icon||"🌐"} {s}</button>
        ))}
      </div>

      {/* Card nudge */}
      {bPlaces.length > 2 && (
        <div style={{marginBottom:18}}>
          <CardNudge card={bestCard} message={`Earn ${bestCard.signupBonus} — worth ${bestCard.signupBonusValue} in travel`} onApply={c=>openAffiliate(c.id)}/>
        </div>
      )}

      {/* Places grid */}
      {filtered.length===0 ? (
        <div className="empty-state" onClick={()=>setShowSave(true)} style={{cursor:"pointer"}}>
          <div style={{fontSize:44}}>📸</div>
          <div className="serif" style={{fontSize:20,marginTop:10}}>Nothing saved yet</div>
          <div style={{fontSize:13,marginTop:6}}>Tap to save your first place from social media</div>
        </div>
      ) : (
        <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(240px,1fr))",gap:14}}>
          {filtered.map(place=>{
            const bc=getBestCard(place.category);
            return(
              <div key={place.id} className="card" style={{overflow:"visible"}}>
                <div style={{position:"relative"}}>
                  <img src={place.image||"https://images.unsplash.com/photo-1488646953014-85cb44e25828?w=600&q=80"} alt="" style={{width:"100%",height:150,objectFit:"cover",borderRadius:"18px 18px 0 0",display:"block"}}/>
                  <div style={{position:"absolute",top:8,left:8}}>
                    <span className="chip" style={{background:SOURCE_META[place.source]?.bg||"#f1f5f9",color:SOURCE_META[place.source]?.text||"#475569"}}>
                      {SOURCE_META[place.source]?.icon||"📍"} {place.source}
                    </span>
                  </div>
                  <button style={{position:"absolute",top:8,right:8,background:"rgba(255,255,255,.9)",border:"none",borderRadius:"50%",width:26,height:26,cursor:"pointer",fontSize:12,display:"flex",alignItems:"center",justifyContent:"center"}} onClick={()=>onRemovePlace(place.id)}>✕</button>
                </div>
                <div style={{padding:"10px 13px 13px"}}>
                  <div className="serif" style={{fontSize:15,fontWeight:700,marginBottom:3}}>{place.title}</div>
                  <div style={{fontSize:11,color:"var(--bark)",marginBottom:5,display:"flex",gap:6,flexWrap:"wrap",alignItems:"center"}}>
                    {place.city&&<span>📍 {place.city}{place.country?`, ${place.country}`:""}</span>}
                    <span className="chip" style={{background:CAT_META[place.category]?.color||"#f1f5f9",color:CAT_META[place.category]?.text||"#475569",fontSize:10}}>{CAT_META[place.category]?.icon} {place.category}</span>
                  </div>
                  {place.note&&<p style={{fontSize:12,color:"#5a4a38",lineHeight:1.5,marginBottom:8}}>{place.note}</p>}
                  <BookingNudge place={place} category={place.category}/>
                  <ViatorNudge category={place.category}/>
                  <CardNudge card={bc} message={place.category} onApply={c=>openAffiliate(c.id)} compact={true}/>
                  {/* Move to trip */}
                  <div style={{display:"flex",gap:7,marginTop:9}}>
                    <button className="btn btn-primary" style={{flex:1,padding:"7px",fontSize:12}} onClick={()=>setMovingPlace(place)}>Add to Trip →</button>
                  </div>
                </div>
              </div>
            );
          })}
        </div>
      )}

      {/* Move to trip modal */}
      {movingPlace&&(
        <div className="overlay" onClick={()=>setMovingPlace(null)}>
          <div className="modal" style={{padding:"22px 24px"}} onClick={e=>e.stopPropagation()}>
            <div className="serif" style={{fontSize:20,fontWeight:700,marginBottom:4}}>Add to a Trip</div>
            <p style={{fontSize:13,color:"var(--bark)",marginBottom:16}}>Move <strong>{movingPlace.title}</strong> to one of your trips</p>
            {trips.length===0?<div style={{textAlign:"center",padding:"20px",color:"var(--bark)"}}>No trips yet — create one first!</div>:
              <div style={{display:"flex",flexDirection:"column",gap:9}}>
                {trips.map(t=>(
                  <div key={t.id} style={{background:"var(--cream)",borderRadius:12,padding:"12px 14px",cursor:"pointer",display:"flex",alignItems:"center",gap:12,border:"1.5px solid transparent",transition:"all .15s"}} onClick={()=>{onMoveToTrip(movingPlace,t.id);setMovingPlace(null);}}>
                    <div style={{width:40,height:40,borderRadius:10,overflow:"hidden",flexShrink:0}}>
                      <img src={t.coverImage} alt="" style={{width:"100%",height:"100%",objectFit:"cover"}}/>
                    </div>
                    <div>
                      <div style={{fontWeight:600,fontSize:14}}>{t.title}</div>
                      <div style={{fontSize:12,color:"var(--bark)"}}>{t.country} · {STATUS_META[t.status]?.icon} {t.status}</div>
                    </div>
                    <div style={{marginLeft:"auto",fontSize:18,color:"var(--bark)"}}>→</div>
                  </div>
                ))}
              </div>}
            <button className="btn btn-secondary" style={{width:"100%",marginTop:12}} onClick={()=>setMovingPlace(null)}>Cancel</button>
          </div>
        </div>
      )}

      {showSave&&<SavePlaceModal boards={[board]} onSave={(place,boardId)=>{onAddPlace(place,boardId);setShowSave(false);}} onClose={()=>setShowSave(false)} defaultBoardId={board.id}/>}
    </div>
  );
}

// ─── SAVE PLACE MODAL (the ReciMe core feature) ───────────────────────────────
function SavePlaceModal({ boards, onSave, onClose, defaultBoardId }) {
  const [step, setStep] = useState("source"); // source → input → details → done
  const [source, setSource] = useState(null);
  const [urlInput, setUrlInput] = useState("");
  const [aiLoading, setAiLoading] = useState(false);
  const [form, setForm] = useState({ title:"",city:"",country:"",category:"Food & Drink",note:"",image:"",address:"" });
  const [boardId, setBoardId] = useState(defaultBoardId||boards[0]?.id||"");
  const SOURCES = ["Instagram","Pinterest","Facebook","TikTok","Manual"];

  async function extractFromUrl() {
    if (!urlInput.trim() && source !== "Manual") return;
    setAiLoading(true);
    const prompt = `A user saved this ${source} URL/content: "${urlInput || "manual entry"}".
Extract the travel place information from it. Return ONLY a JSON object:
{"title":"Place name","city":"City","country":"Country","category":"Food & Drink|Sights|Experiences|Stay|Shopping|Flights & Transport","note":"1-2 sentence insider tip about this place","address":"Street address or neighborhood","image":""}
If you can't extract a specific field, use a sensible default. Category must be one of the exact options listed. Return raw JSON only, no markdown.`;
    try {
      const resp = await fetch("/api/claude", { method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify({ model:"claude-sonnet-4-20250514", max_tokens:400, messages:[{role:"user",content:prompt}] }) });
      const data = await resp.json();
      const text = data.content?.find(b=>b.type==="text")?.text||"";
      const clean = text.replace(/```json|```/g,"").trim();
      const parsed = JSON.parse(clean);
      setForm(f=>({...f,...parsed}));
      setStep("details");
    } catch(e) { setStep("details"); }
    setAiLoading(false);
  }

  function savePlace() {
    if (!form.title) return;
    onSave({ id:Date.now(), boardId, source, ...form, savedAt:new Date().toISOString().split("T")[0] }, boardId);
  }

  return (
    <div className="overlay" onClick={onClose}>
      <div className="modal modal-wide" style={{padding:"24px 26px"}} onClick={e=>e.stopPropagation()}>

        {/* Step 1: Source selection */}
        {step==="source"&&(
          <>
            <div className="serif" style={{fontSize:22,fontWeight:700,marginBottom:4}}>Save a Place</div>
            <p style={{fontSize:13,color:"var(--bark)",marginBottom:20}}>Where did you find this place?</p>
            <div style={{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:12,marginBottom:8}}>
              {SOURCES.map(s=>(
                <button key={s} className="save-source-btn" style={{borderColor:SOURCE_META[s]?.color||"var(--sand)",color:source===s?SOURCE_META[s]?.color||"var(--espresso)":"var(--bark)",background:source===s?`${SOURCE_META[s]?.bg||"#f1f5f9"}`:"var(--white)"}}
                  onClick={()=>{setSource(s);setStep("input");}}>
                  <span style={{fontSize:28}}>{SOURCE_META[s]?.icon||"✏️"}</span>
                  <span style={{fontSize:13,fontWeight:600}}>{s}</span>
                </button>
              ))}
            </div>
            <button className="btn btn-secondary" style={{width:"100%"}} onClick={onClose}>Cancel</button>
          </>
        )}

        {/* Step 2: URL input */}
        {step==="input"&&(
          <>
            <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:16}}>
              <button style={{background:"var(--cream)",border:"none",borderRadius:8,padding:"6px 10px",cursor:"pointer",fontSize:13,color:"var(--bark)"}} onClick={()=>setStep("source")}>← Back</button>
              <div className="serif" style={{fontSize:20,fontWeight:700}}>Save from {source}</div>
            </div>
            <div className="ai-thinking" style={{marginBottom:16}}>
              <div style={{fontWeight:600,fontSize:14,color:"#5b21b6",marginBottom:8}}>✨ AI Place Extractor</div>
              <p style={{fontSize:13,color:"#5b21b6",marginBottom:12,lineHeight:1.5}}>Paste the {source} URL or describe the place and AI will fill in the details automatically.</p>
              <textarea className="input" rows={3} value={urlInput} onChange={e=>setUrlInput(e.target.value)}
                placeholder={source==="Manual"?"Describe the place (e.g. 'A hidden rooftop bar in Montmartre, Paris with amazing views')":
                  `Paste the ${source} post URL here...\ne.g. https://www.${source.toLowerCase()}.com/p/abc123/`}
                style={{resize:"none",marginBottom:10}}/>
              <div style={{display:"flex",gap:9}}>
                <button className="btn btn-ai" style={{flex:1}} onClick={extractFromUrl} disabled={aiLoading||(!urlInput.trim()&&source!=="Manual")}>
                  {aiLoading?<span className="spinning">✨</span>:"✨"} {aiLoading?"Extracting place...":"Extract Place with AI"}
                </button>
                <button className="btn btn-secondary" onClick={()=>setStep("details")}>Fill Manually →</button>
              </div>
            </div>
          </>
        )}

        {/* Step 3: Details form */}
        {step==="details"&&(
          <>
            <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:16}}>
              <button style={{background:"var(--cream)",border:"none",borderRadius:8,padding:"6px 10px",cursor:"pointer",fontSize:13,color:"var(--bark)"}} onClick={()=>setStep("input")}>← Back</button>
              <div className="serif" style={{fontSize:20,fontWeight:700}}>Edit Details</div>
            </div>
            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:11,marginBottom:14}}>
              <div style={{gridColumn:"1/-1"}}><label style={{fontSize:12,fontWeight:500,color:"var(--bark)",display:"block",marginBottom:4}}>Place Name *</label><input className="input" value={form.title} onChange={e=>setForm(f=>({...f,title:e.target.value}))} placeholder="e.g. Le Jules Verne"/></div>
              <div><label style={{fontSize:12,fontWeight:500,color:"var(--bark)",display:"block",marginBottom:4}}>City</label><input className="input" value={form.city} onChange={e=>setForm(f=>({...f,city:e.target.value}))} placeholder="Paris"/></div>
              <div><label style={{fontSize:12,fontWeight:500,color:"var(--bark)",display:"block",marginBottom:4}}>Country</label><input className="input" value={form.country} onChange={e=>setForm(f=>({...f,country:e.target.value}))} placeholder="France"/></div>
              <div><label style={{fontSize:12,fontWeight:500,color:"var(--bark)",display:"block",marginBottom:4}}>Category</label><select className="input sel" value={form.category} onChange={e=>setForm(f=>({...f,category:e.target.value}))}>{CATEGORIES.filter(c=>c!=="All").map(c=><option key={c}>{c}</option>)}</select></div>
              <div><label style={{fontSize:12,fontWeight:500,color:"var(--bark)",display:"block",marginBottom:4}}>Board</label><select className="input sel" value={boardId} onChange={e=>setBoardId(e.target.value)}>{boards.map(b=><option key={b.id} value={b.id}>{b.name}</option>)}</select></div>
              <div style={{gridColumn:"1/-1"}}><label style={{fontSize:12,fontWeight:500,color:"var(--bark)",display:"block",marginBottom:4}}>Address / Neighborhood</label><input className="input" value={form.address} onChange={e=>setForm(f=>({...f,address:e.target.value}))} placeholder="Eiffel Tower area, 7th arrondissement"/></div>
              <div style={{gridColumn:"1/-1"}}><label style={{fontSize:12,fontWeight:500,color:"var(--bark)",display:"block",marginBottom:4}}>Your Note</label><textarea className="input" rows={2} value={form.note} onChange={e=>setForm(f=>({...f,note:e.target.value}))} placeholder="Why you saved it, insider tips..." style={{resize:"vertical"}}/></div>
              <div style={{gridColumn:"1/-1"}}><label style={{fontSize:12,fontWeight:500,color:"var(--bark)",display:"block",marginBottom:4}}>Image URL (optional)</label><input className="input" value={form.image} onChange={e=>setForm(f=>({...f,image:e.target.value}))} placeholder="https://..."/></div>
            </div>
            <div style={{display:"flex",gap:9}}>
              <button className="btn btn-primary" style={{flex:1}} onClick={savePlace} disabled={!form.title}>💾 Save to Board</button>
              <button className="btn btn-secondary" onClick={onClose}>Cancel</button>
            </div>
          </>
        )}
      </div>
    </div>
  );
}
function AITab({ trip, places, onAddPlaces, onApplyCard }) {
  const [loading, setLoading] = useState(false);
  const [result, setResult] = useState(null);
  const [style, setStyle] = useState("balanced");
  const [focus, setFocus] = useState([]);
  const toggleFocus = f => setFocus(prev => prev.includes(f)?prev.filter(x=>x!==f):[...prev,f]);

  async function generatePlan() {
    setLoading(true); setResult(null);
    const n = nights(trip.startDate, trip.endDate);
    const prompt = `You are a world-class travel curator. Create a detailed ${n}-day itinerary for ${trip.title} in ${trip.country} (${trip.cities.join(", ")}).
Travel style: ${style}. Focus areas: ${focus.length?focus.join(", "):"all interests"}. Budget: $${trip.budget?.total||2500} total.
Return ONLY a JSON object (no markdown, no backticks) with this exact structure:
{
  "highlights": ["2-3 sentence trip overview"],
  "days": [
    {
      "day": 1,
      "date": "${trip.startDate}",
      "title": "Day title",
      "city": "City name",
      "theme": "e.g. Art & History",
      "places": [
        {"title":"Place name","category":"Food & Drink|Sights|Experiences|Stay|Shopping|Flights & Transport","address":"Full address","note":"1-2 sentence insider tip","time":"e.g. 9:00 AM","cost":"e.g. $12 or Free","image":"leave empty string"}
      ]
    }
  ],
  "cardTip": "One sentence about which credit card to use for this trip and why",
  "totalEstimate": 2500,
  "packingAdditions": ["2-3 specific items for this trip type"]
}`;
    try {
      const resp = await fetch("https://api.anthropic.com/v1/messages", {
        method:"POST", headers:{"Content-Type":"application/json"},
        body: JSON.stringify({ model:"claude-sonnet-4-20250514", max_tokens:2000, messages:[{role:"user",content:prompt}] })
      });
      const data = await resp.json();
      const text = data.content?.find(b=>b.type==="text")?.text || "";
      const clean = text.replace(/```json|```/g,"").trim();
      const parsed = JSON.parse(clean);
      setResult(parsed);
    } catch(e) { setResult({error:"Could not generate plan. Try again!"}); }
    setLoading(false);
  }

  function addToTrip() {
    if (!result?.days) return;
    const newPlaces = result.days.flatMap((day,di) =>
      day.places.map((p,pi) => ({
        id: Date.now()+di*100+pi, tripId:trip.id, source:"Instagram",
        country:trip.country, city:day.city, title:p.title, note:p.note,
        image:p.image||"", category:p.category||"Sights", address:p.address, order:pi
      }))
    );
    onAddPlaces(newPlaces);
  }

  const bestCard = CARDS.find(c=>c.id==="chase-sapphire-preferred");
  return (
    <div style={{maxWidth:680}}>
      <div className="serif" style={{fontSize:26,fontWeight:700,marginBottom:4}}>✨ AI Trip Planner</div>
      <p style={{fontSize:13,color:"var(--bark)",marginBottom:20}}>Describe your vibe and get a personalized day-by-day itinerary in seconds</p>

      {!result && !loading && (
        <div style={{background:"var(--white)",borderRadius:18,padding:"22px 24px",boxShadow:"0 2px 16px rgba(44,26,14,.08)",marginBottom:20}}>
          <div style={{marginBottom:16}}>
            <div className="section-label">Travel Style</div>
            <div style={{display:"flex",gap:8,flexWrap:"wrap"}}>
              {[["relaxed","🌿 Relaxed"],["balanced","⚖️ Balanced"],["packed","🏃 Action-Packed"],["luxury","✨ Luxury"],["budget","💰 Budget-Smart"]].map(([k,l])=>(
                <button key={k} className={`pill${style===k?" active":""}`} onClick={()=>setStyle(k)}>{l}</button>
              ))}
            </div>
          </div>
          <div style={{marginBottom:20}}>
            <div className="section-label">Focus Areas (pick any)</div>
            <div style={{display:"flex",gap:8,flexWrap:"wrap"}}>
              {["Food & Wine","History & Art","Nature","Nightlife","Shopping","Hidden Gems","Local Culture","Architecture","Photography Spots","Day Trips"].map(f=>(
                <button key={f} className={`pill${focus.includes(f)?" active":""}`} onClick={()=>toggleFocus(f)}>{f}</button>
              ))}
            </div>
          </div>
          <button className="btn btn-ai" style={{width:"100%",padding:"14px",fontSize:15}} onClick={generatePlan}>
            ✨ Generate My {nights(trip.startDate,trip.endDate)}-Day Itinerary
          </button>
          <div style={{marginTop:14}}>
            <CardNudge card={bestCard} message={`Earn ${bestCard.signupBonus} on this trip — worth ${bestCard.signupBonusValue}`} onApply={onApplyCard}/>
          </div>
        </div>
      )}

      {loading && (
        <div className="ai-thinking" style={{textAlign:"center",padding:"40px 24px",marginBottom:20}}>
          <div style={{fontSize:36,marginBottom:12}} className="spinning">✨</div>
          <div className="serif" style={{fontSize:20,fontWeight:700,color:"#5b21b6"}}>Crafting your perfect itinerary…</div>
          <div style={{fontSize:13,color:"#7c3aed",marginTop:8}}>Curating hidden gems, timing it just right, balancing every day</div>
        </div>
      )}

      {result?.error && <div style={{background:"#fef2f2",border:"1px solid #fecaca",borderRadius:12,padding:"14px",color:"var(--red)",marginBottom:16}}>{result.error}</div>}

      {result && !result.error && (
        <div className="fade-in">
          {result.highlights && <div style={{background:"linear-gradient(135deg,#ede9fe,#faf5ff)",borderRadius:16,padding:"16px 20px",marginBottom:20,border:"1px solid #c4b5fd"}}>
            <div style={{fontWeight:700,fontSize:14,color:"#5b21b6",marginBottom:6}}>✨ Your Trip at a Glance</div>
            <p style={{fontSize:14,color:"#4c1d95",lineHeight:1.65}}>{result.highlights[0]}</p>
          </div>}
          {result.days?.map(day=>(
            <div key={day.day} style={{background:"var(--white)",borderRadius:18,padding:"18px 20px",marginBottom:14,boxShadow:"0 2px 14px rgba(44,26,14,.07)"}}>
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:14,flexWrap:"wrap",gap:8}}>
                <div>
                  <div style={{fontSize:11,fontWeight:700,color:"var(--bark)",textTransform:"uppercase",letterSpacing:".06em"}}>Day {day.day} · {day.city}{day.date?` · ${fmtDateShort(day.date)}`:""}</div>
                  <div className="serif" style={{fontSize:20,fontWeight:700,marginTop:2}}>{day.title}</div>
                </div>
                <span style={{background:"#ede9fe",color:"#5b21b6",borderRadius:10,padding:"4px 12px",fontSize:12,fontWeight:600}}>{day.theme}</span>
              </div>
              <div style={{display:"flex",flexDirection:"column",gap:8}}>
                {day.places?.map((p,i)=>(
                  <div key={i} style={{display:"flex",gap:12,alignItems:"flex-start",padding:"10px 12px",borderRadius:12,background:"#faf8f5",border:"1px solid var(--sand)"}}>
                    <div style={{width:30,height:30,borderRadius:"50%",background:"var(--cream)",display:"flex",alignItems:"center",justifyContent:"center",fontWeight:700,fontSize:12,color:"var(--bark)",flexShrink:0}}>{i+1}</div>
                    <div style={{flex:1}}>
                      <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",flexWrap:"wrap",gap:4}}>
                        <div style={{fontWeight:600,fontSize:14}}>{p.title}</div>
                        <div style={{display:"flex",gap:6,alignItems:"center"}}>
                          {p.time&&<span style={{fontSize:11,color:"var(--bark)",background:"var(--cream)",borderRadius:8,padding:"2px 8px"}}>{p.time}</span>}
                          {p.cost&&<span style={{fontSize:11,fontWeight:700,color:"var(--green)"}}>{p.cost}</span>}
                        </div>
                      </div>
                      <div style={{fontSize:11,color:"var(--bark)",marginTop:2}}>📍 {p.address}</div>
                      <p style={{fontSize:12,color:"#5a4a38",marginTop:4,lineHeight:1.5}}>{p.note}</p>
                    </div>
                    <span className="chip" style={{background:CAT_META[p.category]?.color||"#f1f5f9",color:CAT_META[p.category]?.text||"#475569",flexShrink:0}}>{CAT_META[p.category]?.icon||"📍"}</span>
                  </div>
                ))}
              </div>
            </div>
          ))}

// ─── TAB: CALENDAR ────────────────────────────────────────────────────────────
function CalendarTab({ trip, places, transport }) {
  const [selectedDay, setSelectedDay] = useState(null);
  const allDates = trip.startDate&&trip.endDate ? getDatesInRange(trip.startDate,trip.endDate) : [];

  const itemsForDay = useCallback(date => {
    const ps = places.filter(p => (trip.calendarDays?.[date]||[]).includes(p.id));
    const ts = transport.filter(t => t.date===date);
    return { places:ps, transport:ts };
  },[places,transport,trip.calendarDays]);

  if (!allDates.length) return (
    <div className="empty-state"><div style={{fontSize:44}}>🗓</div><div className="serif" style={{fontSize:20,marginTop:10}}>Add trip dates to see the calendar</div></div>
  );

  const weeks = [];
  for(let i=0;i<allDates.length;i+=7) weeks.push(allDates.slice(i,i+7));

  return (
    <div>
      <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:16,flexWrap:"wrap",gap:10}}>
        <div><div className="serif" style={{fontSize:24,fontWeight:700}}>Day-by-Day Planner</div><div style={{fontSize:13,color:"var(--bark)"}}>{allDates.length} days · {fmtDate(trip.startDate)} – {fmtDate(trip.endDate)}</div></div>
        <div style={{fontSize:12,color:"var(--bark)",display:"flex",gap:14}}>
          <span>🟡 Has places</span><span>✈️ Transport day</span>
        </div>
      </div>
      <div style={{display:"grid",gridTemplateColumns:"repeat(7,1fr)",gap:8,marginBottom:8}}>
        {["Sun","Mon","Tue","Wed","Thu","Fri","Sat"].map(d=><div key={d} style={{textAlign:"center",fontSize:11,fontWeight:700,color:"var(--bark)",padding:"4px 0"}}>{d}</div>)}
      </div>
      {weeks.map((week,wi)=>(
        <div key={wi} style={{display:"grid",gridTemplateColumns:"repeat(7,1fr)",gap:8,marginBottom:8}}>
          {week.map(date=>{
            const { places:dp, transport:dt } = itemsForDay(date);
            const hasItems = dp.length>0||dt.length>0;
            const d = new Date(date+"T00:00:00");
            const isSelected = selectedDay===date;
            return (
              <div key={date} className={`cal-day${hasItems?" has-items":""}${isSelected?" today":""}`}
                style={{...(isSelected?{borderColor:"var(--gold)",background:"#fffbf0",boxShadow:"0 4px 14px rgba(201,151,58,.2)"}:{})}}
                onClick={()=>setSelectedDay(isSelected?null:date)}>
                <div style={{fontSize:12,fontWeight:700,color:isSelected?"var(--gold)":"var(--bark)",marginBottom:4}}>
                  {d.getDate()}
                  {dt.length>0&&<span style={{marginLeft:4}}>✈️</span>}
                </div>
                {dt.map(t=><div key={t.id} className="cal-item" style={{background:"#e0f2fe",color:"#0369a1"}}>{TRANSPORT_ICONS[t.type]} {t.from?.split(" ")[0]}→{t.to?.split(" ")[0]}</div>)}
                {dp.map(p=><div key={p.id} className="cal-item" style={{background:CAT_META[p.category]?.color||"#f1f5f9",color:CAT_META[p.category]?.text||"#475569"}}>{CAT_META[p.category]?.icon} {p.title}</div>)}
              </div>
            );
          })}
          {week.length<7&&Array(7-week.length).fill(0).map((_,i)=><div key={"e"+i}/>)}
        </div>
      ))}
      {selectedDay && (() => {
        const { places:dp, transport:dt } = itemsForDay(selectedDay);
        const weather = WEATHER_DATA[trip.cities[0]];
        const dayW = weather?.forecast[0];
        return (
          <div style={{background:"var(--white)",borderRadius:18,padding:"18px 20px",boxShadow:"0 4px 20px rgba(44,26,14,.12)",marginTop:8,border:"1px solid var(--sand)"}}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:14}}>
              <div className="serif" style={{fontSize:20,fontWeight:700}}>{fmtDate(selectedDay)}</div>
              {dayW&&<div style={{background:"#e0f2fe",borderRadius:10,padding:"6px 12px",fontSize:13,color:"#0369a1",fontWeight:600}}>{dayW.icon} {dayW.high}° / {dayW.low}°</div>}
            </div>
            {dt.length===0&&dp.length===0&&<div style={{textAlign:"center",padding:"20px",color:"var(--bark)",fontSize:13}}>Nothing planned yet — add places from the Places tab</div>}
            {dt.map(t=><div key={t.id} style={{display:"flex",gap:12,alignItems:"center",padding:"10px 14px",background:"#e0f2fe",borderRadius:12,marginBottom:8}}>
              <span style={{fontSize:20}}>{TRANSPORT_ICONS[t.type]}</span>
              <div><div style={{fontWeight:600,fontSize:14}}>{t.from} → {t.to}</div><div style={{fontSize:12,color:"#0369a1"}}>{t.carrier} {t.flightNo} · {t.time}</div></div>
            </div>)}
            {dp.map(p=><div key={p.id} style={{display:"flex",gap:12,alignItems:"center",padding:"10px 14px",background:"var(--cream)",borderRadius:12,marginBottom:8}}>
              <span style={{fontSize:20}}>{CAT_META[p.category]?.icon||"📍"}</span>
              <div style={{flex:1}}><div style={{fontWeight:600,fontSize:14}}>{p.title}</div><div style={{fontSize:12,color:"var(--bark)"}}>📍 {p.address}</div></div>
              <span className="chip" style={{background:CAT_META[p.category]?.color,color:CAT_META[p.category]?.text}}>{p.category}</span>
            </div>)}
          </div>
        );
      })()}
    </div>
  );
}

// ─── TAB: DOCUMENTS ───────────────────────────────────────────────────────────
function DocumentsTab({ trip, onUpdate }) {
  const [showAdd, setShowAdd] = useState(false);
  const [form, setForm] = useState({label:"",type:"passport",notes:"",photo:null});
  const [photoPreview, setPhotoPreview] = useState(null);
  const DOC_TYPES = [{k:"passport",l:"Passport",i:"🛂"},{k:"visa",l:"Visa",i:"📋"},{k:"insurance",l:"Travel Insurance",i:"🛡️"},{k:"vaccine",l:"Vaccine Record",i:"💉"},{k:"booking",l:"Hotel/Flight Booking",i:"🏨"},{k:"id",l:"ID/Driver's License",i:"🪪"},{k:"qr",l:"QR/Ticket",i:"🎫"},{k:"other",l:"Other",i:"📄"}];

  function handlePhoto(e){
    const file=e.target.files?.[0]; if(!file)return;
    const reader=new FileReader(); reader.onload=ev=>setPhotoPreview(ev.target.result); reader.readAsDataURL(file);
  }
  function addDoc(){
    if(!form.label)return;
    const newDoc={id:"d"+Date.now(),...form,photo:photoPreview};
    onUpdate({documents:[...(trip.documents||[]),newDoc]});
    setForm({label:"",type:"passport",notes:"",photo:null}); setPhotoPreview(null); setShowAdd(false);
  }
  function removeDoc(id){ onUpdate({documents:(trip.documents||[]).filter(d=>d.id!==id)}); }

  return (
    <div style={{maxWidth:600}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:16}}>
        <div><div className="serif" style={{fontSize:24,fontWeight:700}}>Travel Documents</div><div style={{fontSize:13,color:"var(--bark)",marginTop:2}}>Secure vault for passports, visas, bookings & more</div></div>

        <button className="btn btn-gold" style={{padding:"7px 12px",fontSize:12,flexShrink:0}} onClick={()=>{}}>Learn More →</button>
      </div>

      {(trip.documents||[]).length===0&&!showAdd&&(
        <div className="empty-state" style={{cursor:"pointer"}} onClick={()=>setShowAdd(true)}>
          <div style={{fontSize:44}}>🛂</div>
          <div className="serif" style={{fontSize:20,marginTop:10}}>No documents saved yet</div>

            <div key={doc.id} className="doc-card">
              <div style={{display:"flex",gap:12,alignItems:"flex-start"}}>
                {doc.photo?<img src={doc.photo} alt="" style={{width:60,height:60,borderRadius:10,objectFit:"cover",flexShrink:0}}/>:<div style={{width:60,height:60,borderRadius:10,background:"var(--cream)",display:"flex",alignItems:"center",justifyContent:"center",fontSize:28,flexShrink:0}}>{dt.i}</div>}
                <div style={{flex:1}}>
                  <div style={{fontWeight:700,fontSize:14}}>{doc.label}</div>
                  <div style={{fontSize:12,color:"var(--bark)",marginTop:2}}>{dt.i} {dt.l}</div>
                  {doc.notes&&<div style={{fontSize:12,color:"#5a4a38",marginTop:4,fontStyle:"italic"}}>{doc.notes}</div>}

          </div>
          <input className="input" placeholder="Label (e.g. 'My Passport')" value={form.label} onChange={e=>setForm(f=>({...f,label:e.target.value}))} style={{marginBottom:10}}/>

          <label style={{display:"block",border:"2px dashed var(--sand)",borderRadius:12,padding:"16px",textAlign:"center",cursor:"pointer",marginBottom:10,background:"#fafaf8"}}>

// ─── TAB: EXPENSES (Group Splitting) ─────────────────────────────────────────
function ExpensesTab({ trip, onUpdate, onApplyCard }) {
  const [showAdd, setShowAdd] = useState(false);
  const [form, setForm] = useState({desc:"",amount:"",paidBy:"Me",splitWith:[],category:"Food & Drink",date:trip.startDate||""});
  const members = ["Me", ...(trip.collaborators||[])];
  const toggleSplit = m => setForm(f=>({...f,splitWith:f.splitWith.includes(m)?f.splitWith.filter(x=>x!==m):[...f.splitWith,m]}));

  function addExpense(){
    if(!form.desc||!form.amount)return;
    const exp={id:"e"+Date.now(),...form,amount:parseFloat(form.amount)};
    onUpdate({expenses:[...(trip.expenses||[]),exp]});
    setForm({desc:"",amount:"",paidBy:"Me",splitWith:[],category:"Food & Drink",date:trip.startDate||""});
    setShowAdd(false);
  }
  function removeExpense(id){ onUpdate({expenses:(trip.expenses||[]).filter(e=>e.id!==id)}); }

  const expenses = trip.expenses||[];
  const totalSpentExp = expenses.reduce((a,e)=>a+e.amount,0);
  const myShare = expenses.reduce((a,e)=>{
    const splitCount = 1 + (e.splitWith||[]).length;
    if(e.paidBy==="Me") return a;
    if((e.splitWith||[]).includes("Me")) return a + e.amount/splitCount;
    return a;
  },0);
  const iOwe = expenses.reduce((a,e)=>{
    if(e.paidBy!=="Me"&&(e.splitWith||[]).includes("Me")) return a+e.amount/(1+(e.splitWith||[]).length);
    return a;
  },0);
  const theyOwe = expenses.reduce((a,e)=>{
    if(e.paidBy==="Me"&&(e.splitWith||[]).length>0) return a+e.amount/(1+(e.splitWith||[]).length)*(e.splitWith||[]).length;
    return a;
  },0);

  const bestDiningCard = CARDS.find(c=>c.id==="amex-gold");

          <div key={l} style={{background:"var(--white)",borderRadius:14,padding:"12px 14px",boxShadow:"0 1px 8px rgba(44,26,14,.07)",textAlign:"center"}}>
            <div style={{fontSize:11,color:"var(--bark)",marginBottom:4}}>{l}</div>
            <div style={{fontSize:22,fontWeight:700,color:c}}>{v}</div>

              <div style={{flex:1}}>
                <div style={{fontWeight:600,fontSize:14}}>{exp.desc}</div>
                <div style={{fontSize:11,color:"var(--bark)",marginTop:2}}>
                  Paid by <strong>{exp.paidBy}</strong>
                  {exp.splitWith?.length>0&&<> · Split {splitCount} ways (${perPerson}/person)</>}
                  {exp.date&&<> · {fmtDateShort(exp.date)}</>}
                </div>
              </div>
              <div style={{textAlign:"right",flexShrink:0}}>
                <div style={{fontSize:18,fontWeight:700}}>${exp.amount.toFixed(2)}</div>
                {exp.paidBy==="Me"&&exp.splitWith?.length>0&&<div style={{fontSize:11,color:"var(--green)"}}>+${(exp.amount-parseFloat(perPerson)).toFixed(2)} owed to you</div>}
                {exp.paidBy!=="Me"&&(exp.splitWith||[]).includes("Me")&&<div style={{fontSize:11,color:"var(--red)"}}>-${perPerson} you owe</div>}
              </div>
              <button style={{background:"none",border:"none",cursor:"pointer",color:"#ddd",fontSize:14,flexShrink:0}} onClick={()=>removeExpense(exp.id)}>✕</button>
            </div>
          );
        })}
      </div>

      {showAdd&&(
        <div style={{background:"var(--white)",borderRadius:18,padding:"20px 22px",boxShadow:"0 4px 20px rgba(44,26,14,.12)",marginTop:14,border:"1px solid var(--sand)"}}>
          <div style={{fontWeight:700,fontSize:16,marginBottom:14}}>Add Expense</div>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,marginBottom:10}}>
            <div style={{gridColumn:"1/-1"}}><input className="input" placeholder="Description (e.g. Dinner at Le Jules Verne)" value={form.desc} onChange={e=>setForm(f=>({...f,desc:e.target.value}))}/></div>
            <div><input className="input" type="number" placeholder="Amount $" value={form.amount} onChange={e=>setForm(f=>({...f,amount:e.target.value}))}/></div>
            <div><input className="input" type="date" value={form.date} onChange={e=>setForm(f=>({...f,date:e.target.value}))}/></div>
            <div><label style={{fontSize:12,fontWeight:500,color:"var(--bark)",display:"block",marginBottom:5}}>Category</label><select className="input sel" value={form.category} onChange={e=>setForm(f=>({...f,category:e.target.value}))}>{CATEGORIES.filter(c=>c!=="All").map(c=><option key={c}>{c}</option>)}</select></div>
            <div><label style={{fontSize:12,fontWeight:500,color:"var(--bark)",display:"block",marginBottom:5}}>Paid by</label><select className="input sel" value={form.paidBy} onChange={e=>setForm(f=>({...f,paidBy:e.target.value}))}>{members.map(m=><option key={m}>{m}</option>)}</select></div>
          </div>
          {members.length>1&&<div style={{marginBottom:12}}>
            <div style={{fontSize:12,fontWeight:500,color:"var(--bark)",marginBottom:6}}>Split with</div>
            <div style={{display:"flex",gap:7,flexWrap:"wrap"}}>{members.filter(m=>m!==form.paidBy).map(m=><button key={m} className={`pill${form.splitWith.includes(m)?" active":""}`} onClick={()=>toggleSplit(m)}>{m}</button>)}</div>
          </div>}
          <div style={{display:"flex",gap:8}}>
            <button className="btn btn-primary" style={{flex:1}} onClick={addExpense} disabled={!form.desc||!form.amount}>Add Expense</button>
            <button className="btn btn-secondary" onClick={()=>setShowAdd(false)}>Cancel</button>
          </div>
        </div>
      )}
    </div>
  );
}

          <div style={{fontSize:11,color:"#b5a08a",marginTop:4}}>We'll only email trip reminders and card deals worth your time. No spam.</div>

// ─── MAIN APP ─────────────────────────────────────────────────────────────────
function Wanderlist() {
  // Load from localStorage on mount
  const saved = loadState();

  const [showWelcome, setShowWelcome] = useState(()=>{ try { return !localStorage.getItem("wl_user"); } catch(e){return true;} });
  const [justSaved, setJustSaved] = useState(false);
  const [view, setView] = useState("boards");
  const [boards, setBoards] = useState(saved?.boards||INITIAL_BOARDS);
  const [savedPlaces, setSavedPlaces] = useState(saved?.savedPlaces||INITIAL_SAVED_PLACES);
  const [activeBoardId, setActiveBoardId] = useState(null);
  const [trips, setTrips] = useState(saved?.trips||INITIAL_TRIPS);
  const [tripPlaces, setTripPlaces] = useState(saved?.tripPlaces||INITIAL_TRIP_PLACES);
  const [activeTrip, setActiveTrip] = useState(null);
  const [tripTab, setTripTab] = useState("ai");
  const [filterCat, setFilterCat] = useState("All");
  const [filterSource, setFilterSource] = useState("All");
  const [filterCity, setFilterCity] = useState("All");
  const [cardTypeFilter, setCardTypeFilter] = useState("all");
  const [selectedPin, setSelectedPin] = useState(null);
  const dragItem = useRef(null);
  const [dragOver, setDragOver] = useState(null);
  const [newCollab, setNewCollab] = useState("");
  const [newPackItem, setNewPackItem] = useState("");
  const [packFilter, setPackFilter] = useState(null);
  const [showAddTransport, setShowAddTransport] = useState(false);
  const [showAddPlace, setShowAddPlace] = useState(false);
  const [showAddTrip, setShowAddTrip] = useState(false);
  const [showSavePlace, setShowSavePlace] = useState(false);
  const [showParkingModal, setShowParkingModal] = useState(false);
  const [parkingPhotoPreview, setParkingPhotoPreview] = useState(null);
  const emptyTransport = {type:"Flight",from:"",to:"",date:"",time:"",carrier:"",flightNo:"",confirmNo:"",cost:"",notes:"",status:"Planned"};
  const emptyParking = {airport:"",terminal:"",lot:"",level:"",space:"",dailyRate:"",totalDays:"",photo:null,notes:"",returnDate:""};
  const emptyPlace = {title:"",country:"",city:"",source:"Instagram",note:"",category:"Sights",address:"",image:""};
  const emptyTrip = {title:"",country:"",cities:"",status:"Dreaming",type:"City",startDate:"",endDate:"",coverImage:"",notes:""};
  const [transportForm, setTransportForm] = useState(emptyTransport);
  const [parkingForm, setParkingForm] = useState(emptyParking);
  const [placeForm, setPlaceForm] = useState(emptyPlace);
  const [tripForm, setTripForm] = useState(emptyTrip);

  // Persist to localStorage whenever data changes
  const [installPrompt, setInstallPrompt] = useState(null);
  const [showInstallBanner, setShowInstallBanner] = useState(false);

  useEffect(() => {
    const handler = (e) => { e.preventDefault(); setInstallPrompt(e); setShowInstallBanner(true); };
    window.addEventListener("beforeinstallprompt", handler);
    return () => window.removeEventListener("beforeinstallprompt", handler);
  }, []);

  function handleInstall() {
    if (!installPrompt) return;
    installPrompt.prompt();
    installPrompt.userChoice.then(() => { setInstallPrompt(null); setShowInstallBanner(false); });
  }

  useEffect(() => {
    const state = { boards, savedPlaces, trips, tripPlaces };
    saveState(state);
    setJustSaved(true);
    const t = setTimeout(()=>setJustSaved(false), 1800);
    return ()=>clearTimeout(t);
  }, [boards, savedPlaces, trips, tripPlaces]);

  const trip = trips.find(t=>t.id===activeTrip);
  const currentTripPlaces = tripPlaces.filter(p=>p.tripId===activeTrip).sort((a,b)=>a.order-b.order);
  const filteredPlaces = currentTripPlaces.filter(p=>(filterCat==="All"||p.category===filterCat)&&(filterSource==="All"||p.source===filterSource)&&(filterCity==="All"||p.city===filterCity));
  const activeBoard = boards.find(b=>b.id===activeBoardId);

  function updateTrip(id,patch){setTrips(ts=>ts.map(t=>t.id===id?{...t,...patch}:t));}
  function openTrip(id){setActiveTrip(id);setView("trip");setTripTab("ai");setFilterCat("All");setFilterCity("All");setFilterSource("All");}
  function addTrip(){
    if(!tripForm.title||!tripForm.country)return;
    const id="t"+Date.now();
    setTrips(ts=>[...ts,{id,...tripForm,cities:tripForm.cities.split(",").map(c=>c.trim()).filter(Boolean),collaborators:[],
      budget:{total:0,spent:{"Food & Drink":0,Stay:0,Sights:0,Experiences:0,Shopping:0,"Flights & Transport":0,Other:0}},
      expenses:[],packing:[],documents:[],transport:[],flightAlerts:[],parking:null,calendarDays:{}}]);
    setTripForm(emptyTrip);setShowAddTrip(false);openTrip(id);
  }
  function addTripPlace(){
    if(!placeForm.title||!placeForm.city)return;
    setTripPlaces(ps=>[...ps,{...placeForm,id:Date.now(),tripId:activeTrip,order:currentTripPlaces.length}]);
    setPlaceForm({...emptyPlace,country:trip?.country||""});setShowAddPlace(false);
  }
  function removeTripPlace(id){setTripPlaces(ps=>ps.filter(p=>p.id!==id));}
  function onDragStart(e,id){dragItem.current=id;}
  function onDragOver(e,id){e.preventDefault();setDragOver(id);}
  function onDrop(e,targetId){
    e.preventDefault();setDragOver(null);
    if(!dragItem.current||dragItem.current===targetId)return;
    const s=[...currentTripPlaces];const fi=s.findIndex(p=>p.id===dragItem.current);const ti=s.findIndex(p=>p.id===targetId);
    const[moved]=s.splice(fi,1);s.splice(ti,0,moved);
    const reordered=s.map((p,i)=>({...p,order:i}));
    setTripPlaces(ps=>ps.map(p=>reordered.find(r=>r.id===p.id)||p));
    dragItem.current=null;
  }
  function togglePack(id){setTrips(ts=>ts.map(t=>t.id===activeTrip?{...t,packing:t.packing.map(p=>p.id===id?{...p,checked:!p.checked}:p)}:t));}
  function addPackItem(label){if(!label.trim())return;setTrips(ts=>ts.map(t=>t.id===activeTrip?{...t,packing:[...t.packing,{id:"pk"+Date.now(),label:label.trim(),checked:false}]}:t));setNewPackItem("");}
  function removePackItem(id){setTrips(ts=>ts.map(t=>t.id===activeTrip?{...t,packing:t.packing.filter(p=>p.id!==id)}:t));}
  function updateBudgetSpent(cat,val){setTrips(ts=>ts.map(t=>t.id===activeTrip?{...t,budget:{...t.budget,spent:{...t.budget.spent,[cat]:Number(val)||0}}}:t));}
  function updateBudgetTotal(val){setTrips(ts=>ts.map(t=>t.id===activeTrip?{...t,budget:{...t.budget,total:Number(val)||0}}:t));}
  function addCollab(){if(!newCollab.trim())return;updateTrip(activeTrip,{collaborators:[...(trip?.collaborators||[]),newCollab.trim()]});setNewCollab("");}
  function removeCollab(email){updateTrip(activeTrip,{collaborators:trip.collaborators.filter(c=>c!==email)});}
  function addTransport(){if(!transportForm.from||!transportForm.to)return;const seg={...transportForm,id:"tr"+Date.now(),cost:Number(transportForm.cost)||0};setTrips(ts=>ts.map(t=>t.id===activeTrip?{...t,transport:[...(t.transport||[]),seg]}:t));setTransportForm(emptyTransport);setShowAddTransport(false);}
  function removeTransport(id){setTrips(ts=>ts.map(t=>t.id===activeTrip?{...t,transport:(t.transport||[]).filter(s=>s.id!==id)}:t));}
  function updateTransportStatus(id,status){setTrips(ts=>ts.map(t=>t.id===activeTrip?{...t,transport:(t.transport||[]).map(s=>s.id===id?{...s,status}:s)}:t));}
  function openParkingModal(){if(trip?.parking){setParkingForm(trip.parking);setParkingPhotoPreview(trip.parking.photo||null);}else{setParkingForm(emptyParking);setParkingPhotoPreview(null);}setShowParkingModal(true);}
  function saveParking(){updateTrip(activeTrip,{parking:{...parkingForm,photo:parkingPhotoPreview}});setShowParkingModal(false);}
  function clearParking(){updateTrip(activeTrip,{parking:null});setShowParkingModal(false);}
  function handleParkingPhoto(e){const file=e.target.files?.[0];if(!file)return;const reader=new FileReader();reader.onload=ev=>setParkingPhotoPreview(ev.target.result);reader.readAsDataURL(file);}

  // Boards functions
  function createBoard(board){setBoards(bs=>[...bs,board]);}
  function addSavedPlace(place, boardId){
    setSavedPlaces(ps=>[...ps,{...place,boardId}]);
    setBoards(bs=>bs.map(b=>b.id===boardId?{...b,placeIds:[...b.placeIds,place.id]}:b));
  }
  function removeSavedPlace(id){
    setSavedPlaces(ps=>ps.filter(p=>p.id!==id));
    setBoards(bs=>bs.map(b=>({...b,placeIds:b.placeIds.filter(pid=>pid!==id)})));
  }
  function moveToTrip(place, tripId){
    const newPlace = { ...place, id:Date.now(), tripId, order:tripPlaces.filter(p=>p.tripId===tripId).length };
    setTripPlaces(ps=>[...ps,newPlace]);
  }

  const spent = trip?totalSpent(trip.budget):0;
  const budgetPct = trip&&trip.budget?.total>0?Math.min(100,spent/trip.budget.total*100):0;
  const budgetOver = trip&&trip.budget?.total>0&&spent>trip.budget.total;
  const n = trip?nights(trip.startDate,trip.endDate):0;
  const totalTransportCost = trip?(trip.transport||[]).reduce((a,s)=>a+(s.cost||0),0):0;
  const topTravelCard = CARDS.find(c=>c.id==="chase-sapphire-preferred");

  const ALL_TRIP_TABS = [
    ["ai","✨ AI Plan"],["calendar","🗓 Calendar"],["places","📍 Places"],
    ["transport","✈️ Flights"],["budget","💰 Budget"],["cards","💳 Cards"],
    ["country","🌍 Country"],["expenses","💸 Expenses"],["documents","🛂 Docs"],
    ["packing","🎒 Packing"],["journal","📓 Journal"],["collab","👥 Share"],
  ];

  return (
    <div style={{minHeight:"100vh",background:"radial-gradient(ellipse at 70% 20%,#fff8ee 0%,#faf7f2 65%)"}}>
      <style>{CSS}</style>

      {showWelcome&&<WelcomeModal onClose={(email)=>{if(email){try{localStorage.setItem("wl_user",JSON.stringify({email,joined:new Date().toISOString()}));}catch(e){}}setShowWelcome(false);}}/>}
      {justSaved&&<SavedIndicator/>}

      {/* HEADER */}
      <header style={{background:"rgba(255,255,255,.94)",backdropFilter:"blur(12px)",borderBottom:"1px solid var(--sand)",padding:"0 16px",display:"flex",alignItems:"center",justifyContent:"space-between",height:58,position:"sticky",top:0,zIndex:50,gap:8}}>
        <button style={{background:"none",border:"none",cursor:"pointer",display:"flex",alignItems:"center",gap:7,flexShrink:0}} onClick={()=>{setView("boards");setActiveBoardId(null);}}>
          <span style={{fontSize:20}}>✈️</span>
          <span className="serif" style={{fontSize:20,fontWeight:700,color:"var(--espresso)"}}>Wanderlist</span>
        </button>
        <nav style={{display:"flex",gap:2,overflowX:"auto",flex:1,justifyContent:"center"}}>
          <button className={`nav-btn${view==="boards"?" active":""}`} onClick={()=>{setView("boards");setActiveBoardId(null);}}>📋 Boards</button>
          <button className={`nav-btn${view==="discover"?" active":""}`} onClick={()=>setView("discover")}>🔍 Discover</button>
          <button className={`nav-btn${view==="trips"?" active":""}`} onClick={()=>setView("trips")}>🌍 Trips</button>
          {trip&&<button className={`nav-btn${view==="trip"?" active":""}`} onClick={()=>setView("trip")} style={{maxWidth:130,overflow:"hidden",textOverflow:"ellipsis"}}>📍 {trip.title}</button>}
          <button className={`nav-btn${view==="cards"?" active":""}`} onClick={()=>setView("cards")} style={{background:view==="cards"?"linear-gradient(135deg,#c9973a,#e8b84b)":"none",color:view==="cards"?"#fff":"var(--bark)",fontWeight:view==="cards"?700:500}}>💳 Cards</button>
          <button className="nav-btn" onClick={()=>setShowAddTrip(true)}>＋ Trip</button>
        </nav>
      </header>

      <main style={{maxWidth:1000,margin:"0 auto",padding:"24px 14px 120px"}}>

        {/* ══ DISCOVER ══ */}
        {view==="discover"&&(
          <DiscoverView boards={boards} onSaveToBoard={addSavedPlace} onCreateBoard={createBoard}/>
        )}

        {/* ══ BOARDS ══ */}
        {view==="boards"&&!activeBoardId&&(
          <BoardsView boards={boards} savedPlaces={savedPlaces} onSelectBoard={id=>{setActiveBoardId(id);}} onCreateBoard={createBoard} onAddPlace={addSavedPlace} trips={trips} onMoveToTrip={moveToTrip}/>

        {/* ══ TRIPS LIST ══ */}
        {view==="trips"&&(
          <div className="fade-in">
            <div className="serif" style={{fontSize:34,fontWeight:700,color:"var(--espresso)"}}>Your Trips</div>
            <p style={{fontSize:13,color:"var(--bark)",marginBottom:18,marginTop:3}}>Turn your saved boards into real adventures</p>
            <div className="nudge-banner" style={{background:"#f0fdf4",borderColor:"#86efac",marginBottom:20}}>
              <span style={{fontSize:24}}>💳</span>
              <div style={{flex:1}}>
                <div style={{fontSize:14,fontWeight:700,color:"#166534"}}>Finance your next trip at 0% interest</div>
                <div style={{fontSize:12,color:"#166534",marginTop:2}}>Wells Fargo Reflect — up to 21 months interest-free.</div>
                <AffiliateDisclosure/>
              </div>
              <button className="btn btn-gold" style={{padding:"8px 14px",fontSize:12,flexShrink:0}} onClick={()=>openAffiliate("wells-reflect")}>See Offer →</button>
            </div>
            <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(280px,1fr))",gap:18}}>
              {trips.map(t=>{
                const s=totalSpent(t.budget);const sm=STATUS_META[t.status];const pc=tripPlaces.filter(p=>p.tripId===t.id).length;const n2=nights(t.startDate,t.endDate);

                  <div key={t.id} className="card card-h" style={{cursor:"pointer"}} onClick={()=>openTrip(t.id)}>

                      <img src={t.coverImage||"https://images.unsplash.com/photo-1488646953014-85cb44e25828?w=800&q=80"} alt="" style={{width:"100%",height:"100%",objectFit:"cover"}}/>

                        <span>{t.startDate?`${fmtDate(t.startDate)} – ${fmtDate(t.endDate)}`:"Dates TBD"}{n2>0&&<span style={{marginLeft:5,color:"var(--gold)",fontWeight:700}}>{n2}n</span>}</span>

                      </div>
                      {t.budget?.total>0&&<div style={{marginBottom:7}}>
                        <div style={{display:"flex",justifyContent:"space-between",fontSize:11,color:"var(--bark)",marginBottom:3}}><span>Budget</span><span>${s.toLocaleString()} / ${t.budget.total.toLocaleString()}</span></div>

                      </div>}
                    </div>
                  </div>
                );
              })}
              <div className="card" style={{cursor:"pointer",border:"2px dashed var(--sand)",background:"transparent",display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",minHeight:220,boxShadow:"none"}} onClick={()=>setShowAddTrip(true)}>

        {view==="cards"&&(
          <div className="fade-in">

                <InsuranceNudge/>

            {tripTab==="places"&&(

                                <span style={{fontSize:12,fontWeight:700,color:"#0369a1"}}>{seg.type}</span>

                                <div style={{textAlign:"center"}}><div style={{fontSize:15,fontWeight:700}}>{seg.from}</div>{seg.time&&<div style={{fontSize:11,color:"var(--bark)"}}>{seg.date?fmtDate(seg.date):""} {seg.time}</div>}</div>

                  {trip.parking&&<div style={{background:"var(--white)",borderRadius:14,overflow:"hidden",boxShadow:"0 2px 12px rgba(44,26,14,.09)"}}>

                      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:7,marginBottom:trip.parking.notes?8:0}}>

                      </div>
                      {trip.parking.notes&&<div style={{background:"#fffbf0",borderRadius:8,padding:"7px 10px",fontSize:11,color:"#92400e"}}>{trip.parking.notes}</div>}
                      <div style={{display:"flex",gap:7,marginTop:9}}><button className="btn btn-primary" style={{flex:1,padding:"7px",fontSize:12}} onClick={openParkingModal}>✏️ Edit</button><button className="btn btn-secondary" style={{padding:"7px 10px",fontSize:12}} onClick={clearParking}>Clear</button></div>
                    </div>
                  </div>}
                </div>
                {(trip.transport||[]).some(s=>s.type==="Flight")&&<div>
                  <div className="section-label">💳 Best Cards for Flights</div>

                        <AffiliateDisclosure/>
                      </div>
                    ))}
                  </div>
                </div>}
              </div>
            )}

            {/* MAP TAB */}
            {tripTab==="map"&&(
              <div>
                <div style={{display:"flex",gap:7,marginBottom:10,flexWrap:"wrap"}}>
                  {(trip.cities||[]).map(city=><button key={city} className={`pill${filterCity===city?" active":""}`} onClick={()=>setFilterCity(city===filterCity?"All":city)}>{city}</button>)}

                        <div style={{cursor:"pointer"}} onClick={()=>openAffiliate(bc.id)} title={bc.name}><div style={{background:"#fffbf0",borderRadius:7,padding:"3px 7px",fontSize:10,color:"#92400e",fontWeight:600,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{bc.logo} {rate}x*</div></div>

                <div style={{marginBottom:16}}>
                  <div className="section-label">💳 Rewards Optimizer</div>
                  <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(240px,1fr))",gap:12}}>
                    {[CARDS[0],CARDS[1],CARDS[2]].map(card=>{const rv=calcRewards(card,trip.budget);return(<div key={card.id} style={{background:"var(--white)",borderRadius:12,padding:"12px 14px",boxShadow:"0 1px 7px rgba(44,26,14,.07)"}}>

                        <div><div style={{fontSize:11,color:"var(--bark)"}}>Est. rewards</div><div style={{fontSize:18,fontWeight:700}}>${rv.toFixed(0)}</div></div>
                        <div style={{textAlign:"right"}}><div style={{fontSize:11,color:"var(--bark)"}}>Signup bonus</div><div style={{fontSize:13,fontWeight:700,color:"var(--gold)"}}>{card.signupBonusValue}</div></div>

                </div>
                <div className="serif" style={{fontSize:17,fontWeight:700,marginBottom:8}}>Smart Suggestions</div>

                    <div style={{display:"flex",flexWrap:"wrap",gap:6}}>
                      {(PACKING_SUGGESTIONS[type]||[]).map(item=>{const already=(trip.packing||[]).find(p=>p.label===item);return(<button key={item} onClick={()=>{if(!already)addPackItem(item);}} style={{background:already?"#f0fdf4":"var(--cream)",border:already?"1px solid #86efac":"1px solid var(--sand)",borderRadius:18,padding:"4px 11px",fontSize:11,cursor:already?"default":"pointer",color:already?"#166534":"var(--espresso)",fontFamily:"'Outfit',sans-serif"}}>{already?"✓ ":""}{item}</button>);})}
                    </div>
                  </div>

              </div>

                      <span style={{color:"var(--gold)",fontSize:12}}>→</span><span style={{fontSize:13,color:"var(--bark)"}}>{p}</span>
                    </div>

                </div>
              </div>
            )}

            {/* COLLAB TAB */}
            {tripTab==="collab"&&(
              <div style={{maxWidth:460}}>

                    </div>
                  ))}
              </div>
            )}
          </div>
        )}

          <span className="nav-icon">🔍</span>Discover

        </button>

        </button>

        </button>

              <div style={{fontSize:12,color:"var(--bark)",marginBottom:8}}>📍 {selectedPin.address||selectedPin.city}</div>

            </div>
          </div>
        </div>

      {/* Add Place to Trip */}

              </div>
              <div><label style={{fontSize:12,fontWeight:500,color:"var(--bark)",display:"block",marginBottom:4}}>Notes</label><textarea className="input" rows={2} value={placeForm.note} onChange={e=>setPlaceForm(f=>({...f,note:e.target.value}))} style={{resize:"vertical"}}/></div>

            </div>
          </div>
        </div>

        <div className="overlay" onClick={()=>setShowAddTrip(false)}>
